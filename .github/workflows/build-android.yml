name: Build MechVac Task APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the Android tools already on GitHub
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find the app folder
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then echo "settings.gradle.kts not found. Upload the app files first."; exit 1; fi
          echo "APP_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Build the APK
        run: |
          cd "$APP_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: |
          cd "$APP_DIR"
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/MechVacTask-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MechVacTask-APK
          path: out/*.apk
