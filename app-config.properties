# ============================================================
#  MechVac Task Android app: the only file you need to edit
# ============================================================
# Address of your MechVac Task website (must start with https://).
# If the app is in a folder, include it, e.g. https://example.com/task
siteUrl=https://your-website.com

# Name under the app icon on the phone
appName=MechVac Task

# Unique app ID. Keep it the same forever once people install the app.
packageId=com.mechvac.task

# Raise versionCode by 1 (2, 3, 4...) every time you build an update
versionCode=1
versionName=1.0
