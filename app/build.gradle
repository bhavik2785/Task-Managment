plugins {
    id 'com.android.application'
}

// Everything site-specific comes from app-config.properties
def cfg = new Properties()
rootProject.file('app-config.properties').withInputStream { cfg.load(it) }
def siteUrl = cfg.getProperty('siteUrl', '').trim().replaceAll('/+$', '')
if (!siteUrl.startsWith('https://')) {
    throw new GradleException('app-config.properties: siteUrl must start with https:// (currently "' + siteUrl + '")')
}
def uri = new URI(siteUrl)
def origin = uri.scheme + '://' + uri.host + (uri.port > 0 ? ':' + uri.port : '')
def packageId = cfg.getProperty('packageId', 'com.mechvac.task').trim()
def appName = cfg.getProperty('appName', 'MechVac Task').trim()

android {
    namespace 'com.mechvac.twa'
    compileSdk 36

    defaultConfig {
        applicationId packageId
        minSdk 24
        targetSdk 36
        versionCode cfg.getProperty('versionCode', '1').trim().toInteger()
        versionName cfg.getProperty('versionName', '1.0').trim()

        manifestPlaceholders = [
            hostName : uri.host,
            launchUrl: siteUrl + '/dashboard.php',
        ]
        resValue 'string', 'appName', appName
        // tells Android this app may open the website full screen (verified by /.well-known/assetlinks.json)
        resValue 'string', 'assetStatements',
            '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"' + origin + '\\"}}]'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Exact versions match Google's official TWA generator (Bubblewrap): library 2.6.2, AGP 8.9.1, Gradle 8.11.1, SDK 36
    // Google's Trusted Web Activity helper: runs the website in Chrome as a real app,
    // with Chrome's web push notifications delivered as this app's notifications
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
